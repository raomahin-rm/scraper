name: Phase 1 live feed audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-scraper-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Audit first 80 configured company entries (read-only)
        run: python audit_feeds.py --limit 80 --delay 0.5
      - uses: actions/upload-artifact@v4
        with:
          name: company-feed-audit
          path: feed_audit.csv
