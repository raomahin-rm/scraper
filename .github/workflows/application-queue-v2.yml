name: Application automation stages 2 and 3 - safe queue

on:
  push:
    branches: [main]
    paths: [".github/workflows/application-queue-v2.yml"]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, fill, submit]
        default: prepare
      application_id:
        description: One existing queue ID (required for fill/submit)
        type: string
      packet_run_id:
        description: Run containing the exact reviewed greenhouse-pipeline artifact (submit only)
        type: string
      approval_comment_id:
        description: Owner-authored individual approval comment ID (submit only)
        type: string

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: greenhouse-application-pipeline
  cancel-in-progress: false

jobs:
  prepare-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-scraper-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Initialize encrypted private-material access
        env:
          GH_TOKEN: ${{ github.token }}
          GREENHOUSE_WRAPPING_SECRET: ${{ secrets.APPLICATION_PACKET_KEY || secrets.GMAIL_APP_PASSWORD }}
        run: python greenhouse_private_v3.py bootstrap
      - name: Run the complete regression suite
        run: python -m unittest discover -p 'test_*.py'
      - name: Restore previous application queue when available
        if: inputs.mode != 'submit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=application-review-queue&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false) | .workflow_run.id] | .[0] // empty')
          if [ -n "$previous_run" ]; then
            mkdir -p previous-queue
            if gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" -n application-review-queue -D previous-queue; then
              if [ -s previous-queue/applications_v2.json ]; then
                cp previous-queue/applications_v2.json applications_v2.json
                cp previous-queue/v2_shortlist.json v2_shortlist.json
                cp previous-queue/tailored_application_drafts_v2.json tailored_application_drafts_v2.json
                for material in application_review_packets_v2.json application_review_packets_v2.md employer_questions_v2.json employer_answer_matches_v2.json; do
                  if test -s "previous-queue/$material"; then cp "previous-queue/$material" "$material"; fi
                done
                echo "Restored application history from run $previous_run"
              fi
            else
              echo "Previous artifact unavailable; refusing to rebuild history"
              exit 1
            fi
          else
            echo "No previous artifact available; refusing to rebuild history"
            exit 1
          fi
      - name: Refuse missing application history
        if: inputs.mode != 'submit'
        run: test -s applications_v2.json && test -s tailored_application_drafts_v2.json
      - name: Prepare draft applications only
        if: inputs.mode == 'prepare' 
        run: python application_queue_v2.py import --shortlist v2_shortlist.json --db applications_v2.json
      - name: Generate commercial application review packets
        if: inputs.mode == 'prepare'
        run: python application_review_packets_v2.py --db applications_v2.json --bank application_answers_v2.json
      - name: Inspect supported employer application questions (read-only)
        if: inputs.mode == 'prepare'
        run: python employer_questions_v2.py --packets application_review_packets_v2.json --output employer_questions_v2.json
      - name: Match retrieved employer questions to approved answers
        if: inputs.mode == 'prepare'
        run: python employer_answer_matches_v2.py --questions employer_questions_v2.json --bank application_answers_v2.json
      - name: Draft role-specific motivation and optional cover letters
        if: inputs.mode == 'prepare'
        run: python tailored_application_drafts_v2.py --packets application_review_packets_v2.json
      - name: Test Greenhouse approval and browser controls
        run: |
          python -m playwright install --with-deps chromium
          python -m unittest test_greenhouse_pipeline_v3 -v
          RUN_BROWSER_TESTS=1 python -m unittest test_greenhouse_browser_v3 -v
      - name: Restore exact reviewed packet for submission
        if: inputs.mode == 'submit'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKET_RUN: ${{ inputs.packet_run_id }}
        run: |
          [[ "$PACKET_RUN" =~ ^[0-9]+$ ]]
          gh run download "$PACKET_RUN" --repo "$GITHUB_REPOSITORY" -n greenhouse-pipeline -D runtime/greenhouse
          if test -s runtime/greenhouse/packets.enc; then
            python greenhouse_artifacts_v3.py unpack runtime/greenhouse/packets.enc runtime/greenhouse
          fi
          cp runtime/greenhouse/applications_v2.json applications_v2.json
      - name: Restore encrypted private application materials
        if: inputs.mode != 'submit'
        env:
          GH_TOKEN: ${{ github.token }}
          GREENHOUSE_WRAPPING_SECRET: ${{ secrets.APPLICATION_PACKET_KEY || secrets.GMAIL_APP_PASSWORD }}
        run: |
          mkdir -p runtime/private runtime/source
          python greenhouse_private_v3.py restore --destination runtime/private --allow-empty
          cp applications_v2.json tailored_application_drafts_v2.json runtime/source/
      - name: Screen descriptions and prepare employer-specific packets
        if: inputs.mode != 'submit'
        shell: bash
        run: |
          args=()
          if test -s runtime/private/resume.pdf; then args+=(--resume runtime/private/resume.pdf); fi
          python greenhouse_pipeline_v3.py prepare --source runtime/source --output runtime/greenhouse --contact-json runtime/private/contact.json --overrides-json runtime/private/overrides.json "${args[@]}"
          cp runtime/greenhouse/applications_v2.json applications_v2.json
      - name: Live form prefill without submission
        if: inputs.mode == 'fill' || github.event_name == 'push'
        env:
          APP_ID: ${{ inputs.application_id || '8cc6088f647c3ded' }}
        run: |
          [[ "$APP_ID" =~ ^[a-f0-9]{16}$ ]]
          python greenhouse_pipeline_v3.py fill --packet "runtime/greenhouse/$APP_ID/packet.json" --db applications_v2.json --output "runtime/greenhouse/$APP_ID/live"
      - name: Submit exactly one individually approved application
        if: inputs.mode == 'submit'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ inputs.application_id }}
          COMMENT_ID: ${{ inputs.approval_comment_id }}
          GREENHOUSE_WRAPPING_SECRET: ${{ secrets.APPLICATION_PACKET_KEY || secrets.GMAIL_APP_PASSWORD }}
        run: |
          [[ "$APP_ID" =~ ^[a-f0-9]{16}$ ]]
          [[ "$COMMENT_ID" =~ ^[0-9]+$ ]]
          python greenhouse_private_v3.py restore --destination runtime/private
          python greenhouse_pipeline_v3.py submit --packet "runtime/greenhouse/$APP_ID/packet.json" --db applications_v2.json --output "runtime/greenhouse/$APP_ID/live" --approval-comment "$COMMENT_ID"
      - name: Preserve Greenhouse outcomes
        if: always()
        run: |
          mkdir -p runtime/greenhouse
          if test -s applications_v2.json; then cp applications_v2.json runtime/greenhouse/applications_v2.json; fi
      - name: Encrypt private review artifacts
        if: always()
        run: |
          mkdir -p runtime/publish
          if [ -n "$APPLICATION_PACKET_KEY" ]; then
            python greenhouse_artifacts_v3.py pack runtime/greenhouse runtime/publish/packets.enc
          else
            cp -r runtime/greenhouse/. runtime/publish/
            find runtime/publish -name '*.png' -delete
          fi
          python - <<'PY'
          import json,pathlib
          summaries=[json.loads(p.read_text()) for p in pathlib.Path('runtime/greenhouse').rglob('result.public.json')]
          pathlib.Path('runtime/publish/public-summary.json').write_text(json.dumps({'applications':summaries},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenhouse-pipeline
          retention-days: 90
          path: |
            runtime/publish/**
      - name: Assert no applications were submitted
        if: inputs.mode != 'submit' 
        run: |
          python - <<'PY'
          import json
          data=json.load(open('applications_v2.json'))
          assert data['applications']
          from collections import Counter
          print('Application history:',len(data['applications']))
          print('Statuses:',dict(Counter(a['status'] for a in data['applications'].values())))
          print('This workflow performed no submissions.')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode != 'submit'
        with:
          name: application-review-queue
          retention-days: 90
          path: |
            applications_v2.json
            v2_shortlist.json
            application_review_packets_v2.json
            application_review_packets_v2.md
            employer_questions_v2.json
            employer_answer_matches_v2.json
            tailored_application_drafts_v2.json
