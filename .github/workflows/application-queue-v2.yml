name: Application automation stages 2 and 3 - safe queue

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-scraper-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test approval gates and duplicate prevention
        run: python test_application_queue_v2.py && python test_application_answers_v2.py && python test_employer_questions_v2.py && python test_employer_answer_matches_v2.py && python test_scraper_v2.py && python test_rank_v2.py
      - name: Retrieve and rank jobs
        run: |
          python scraper_v2.py --limit 305 --output v2_jobs.json
          python rank_v2.py --input v2_jobs.json --output v2_shortlist.json --limit 40
      - name: Restore previous application queue when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=application-review-queue&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false) | .workflow_run.id] | .[0] // empty')
          if [ -n "$previous_run" ]; then
            mkdir -p previous-queue
            if gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" -n application-review-queue -D previous-queue; then
              if [ -s previous-queue/applications_v2.json ]; then
                cp previous-queue/applications_v2.json applications_v2.json
                echo "Restored application history from run $previous_run"
              fi
            else
              echo "Previous artifact unavailable; starting a new queue"
            fi
          else
            echo "No previous artifact available; starting a new queue"
          fi
      - name: Prepare draft applications only
        run: python application_queue_v2.py import --shortlist v2_shortlist.json --db applications_v2.json
      - name: Generate commercial application review packets
        run: python application_review_packets_v2.py --db applications_v2.json --bank application_answers_v2.json
      - name: Inspect supported employer application questions (read-only)
        run: python employer_questions_v2.py --packets application_review_packets_v2.json --output employer_questions_v2.json
      - name: Match retrieved employer questions to approved answers
        run: python employer_answer_matches_v2.py --questions employer_questions_v2.json --bank application_answers_v2.json
      - name: Draft role-specific motivation and optional cover letters
        run: python tailored_application_drafts_v2.py --packets application_review_packets_v2.json
      - name: Assert no applications were submitted
        run: |
          python - <<'PY'
          import json
          data=json.load(open('applications_v2.json'))
          assert data['applications']
          from collections import Counter
          print('Application history:',len(data['applications']))
          print('Statuses:',dict(Counter(a['status'] for a in data['applications'].values())))
          print('This workflow performed no submissions.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: application-review-queue
          retention-days: 90
          path: |
            applications_v2.json
            v2_shortlist.json
            application_review_packets_v2.json
            application_review_packets_v2.md
            employer_questions_v2.json
            employer_answer_matches_v2.json
            tailored_application_drafts_v2.json
