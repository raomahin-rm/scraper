name: Replacement v2 daily preview (no email)

on:
  schedule:
    # Preview at 12:30 UTC; legacy production scan remains separate.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replacement-v2-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-scraper-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run delivery and history regression tests
        run: python test_rank_v2.py && python test_history_v2.py && python test_deliver_v2.py
      - name: Retrieve jobs (all configured company entries; no mail)
        run: python scraper_v2.py --limit 305 --output v2_jobs.json
      - name: Rank eligible jobs
        run: python rank_v2.py --input v2_jobs.json --output v2_shortlist.json --limit 40
      - name: Generate pending-jobs email preview (no send)
        run: python deliver_v2.py --input v2_shortlist.json --history v2_history.json --preview v2_pending_preview.html
      - name: Confirm history was not created or changed
        run: git diff --exit-code -- v2_history.json && test ! -e v2_history.json
      - uses: actions/upload-artifact@v4
        with:
          name: replacement-v2-daily-preview
          retention-days: 14
          path: |
            v2_shortlist.json
            v2_pending_preview.html
