name: Replacement v2 daily ranked job email

on:
  schedule:
    # Preview at 12:30 UTC; legacy production scan remains separate.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: replacement-v2-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-scraper-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run delivery and history regression tests
        run: python test_scraper_v2.py && python test_rank_v2.py && python test_history_v2.py && python test_deliver_v2.py
      - name: Retrieve jobs (all configured company entries; no mail)
        run: python scraper_v2.py --limit 305 --output v2_jobs.json
      - name: Rank eligible jobs
        run: python rank_v2.py --input v2_jobs.json --output v2_shortlist.json --limit 40
      - name: Restore previously emailed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=v2-email-history&per_page=30" --jq '[.artifacts[] | select(.expired == false) | .workflow_run.id] | .[0] // empty')
          if [ -n "$previous_run" ]; then
            mkdir -p previous-email
            if gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" -n v2-email-history -D previous-email; then
              if [ -s previous-email/v2_history.json ]; then cp previous-email/v2_history.json v2_history.json; fi
            fi
          fi
      - name: Email new ranked job opportunities
        run: python deliver_v2.py --input v2_shortlist.json --history v2_history.json --preview v2_pending_preview.html --send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Save email deduplication history
        uses: actions/upload-artifact@v4
        with:
          name: v2-email-history
          retention-days: 90
          path: v2_history.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: replacement-v2-daily-ranked-results
          retention-days: 14
          path: |
            v2_shortlist.json
            v2_pending_preview.html
