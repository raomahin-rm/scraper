name: Phase 1 safe tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "job_scraper.py"
      - "scraper_v2.py"
      - "rank_v2.py"
      - "history_v2.py"
      - "email_preview_v2.py"
      - "deliver_v2.py"
      - "workday.py"
      - "config.py"
      - "companies.csv"
      - "test_*.py"
      - ".github/workflows/phase1-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run offline regression tests
        run: python test_offline.py && python test_phase1.py && python test_scraper_v2.py && python test_rank_v2.py && python test_history_v2.py && python test_deliver_v2.py
      - name: Confirm historical state remains unchanged
        run: git diff --exit-code -- seen_jobs.json
